<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background circle -->
  <circle cx="200" cy="220" r="180" fill="#dceaf6"/>

  <!-- Head -->
  <circle cx="200" cy="120" r="40" fill="#ffb685"/>

  <!-- Hair -->
  <path d="M160 100 Q200 40 240 100 L240 150 Q200 170 160 150 Z" fill="#0c2d6b"/>

  <!-- Eyes -->
  <circle cx="185" cy="120" r="4" fill="#000"/>
  <circle cx="215" cy="120" r="4" fill="#000"/>

  <!-- Body -->
  <rect x="150" y="160" width="100" height="200" rx="20" fill="#ffffff"/>

  <!-- Inner shirt -->
  <rect x="180" y="160" width="40" height="200" fill="#1e6fff"/>

  <!-- Stethoscope -->
  <path d="M170 170 Q200 220 230 170" stroke="#0c2d6b" stroke-width="4" fill="none"/>
  <circle cx="200" cy="240" r="8" fill="#0c2d6b"/>

  <!-- Left arm holding tablet -->
  <rect x="120" y="200" width="40" height="120" rx="20" fill="#ffb685"/>
  
  <!-- Tablet -->
  <rect x="90" y="200" width="80" height="100" rx="10" fill="#0c2d6b"/>

  <!-- Right arm -->
  <rect x="250" y="200" width="40" height="120" rx="20" fill="#ffb685"/>

  <!-- Coat border -->
  <line x1="200" y1="160" x2="200" y2="360" stroke="#ccc" stroke-width="2"/>

</svg>
